<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Expense Splitter</title>
   <link rel="stylesheet"
        href="{{ url_for('static', filename='css/sign-up.css') }}">
</head>
<body>

    <div class="container">
        <h1>💰 Expense Splitter</h1>
        <p>Create your account</p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}
        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit" class="signup-btn">
                Sign Up
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>
    </div>

</body>
</html>
