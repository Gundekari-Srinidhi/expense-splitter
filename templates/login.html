<!DOCTYPE html>
<html>
<head>
    <title>Expense Splitter</title>
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <div class="container">
        <h1>💰 Expense Splitter</h1>
        <p>Split expenses with friends easily</p>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button
                class="login-btn"
                type="submit">
                Login
            </button>

        </form>

        

        <button class="google-btn">
            Continue with Google
        </button>

        <div class="signup">
            <p>
                Don't have an account?
                <a href="/signup">Sign Up</a>
            </p>
        </div>
    </div>

</body>
</html>
