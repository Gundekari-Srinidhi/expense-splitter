<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/add-expense.css') }}">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>💸 Add Expense</h1>
        <p>Add a new expense to your group.</p>
    </div>

    <form method="POST">

        <label>Expense Name</label>
        <input
            type="text"
            id="expenseName"
            name="expenseName">

        <label>Amount</label>
        <input
            type="number"
            id="expenseAmount"
            name="expenseAmount">

        <label>Paid By</label>

        <select
            id="paidBy"
            name="paidBy">

            {% for member in group.members %}

            <option value="{{ member }}">
                {{ member }}
            </option>

            {% endfor %}

        </select>

        <label>Split Among</label>


        <div class="members">

            {% for member in group.members %}

            <label class="checkbox">

                <input
                    type="checkbox"
                    name="splitAmong"
                    value="{{ member }}"
                    checked>

                {{ member }}

            </label>

            {% endfor %}

        </div>


        <button
            type="submit"
            class="save-btn">
            Save Expense
        </button>
        
    </form>
    <a href="/group/{{ id }}">
        <button class="back-btn">
            ← Back to Group
        </button>
    </a>
</div>

<script src="{{ url_for('static', filename='js/add-expense.js') }}"></script>

</body>
</html>
