<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Group</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/create-group.css') }}">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>Create New Group 👥</h1>
            <p>Create a group and add your friends.</p>
        </div>

        <form method="POST" action="/create-group">

            <label>Group Name</label>
            <input
                type="text"
                id="groupName"
                name="groupName">

            <label>Description</label>
            <textarea
                id="groupDescription"
                name="groupDescription">
            </textarea>

            <div class="member-section">

                <label>Add Member</label>

                <div class="member-input">
                    <input
                        type="email"
                        id="memberEmail"
                        placeholder="friend@gmail.com"
                    >

                    <button
                        type="button"
                        id="addMemberBtn">
                        + Add
                    </button>
                </div>

            </div>

            <div class="members-list">

                <h3>Members</h3>

                <ul id="membersList">

                </ul>
                <input
                    type="hidden"
                    id="members"
                    name="members">

            </div>

            <button
                type="submit"
                id="createGroupBtn"
                class="create-btn">
                Create Group
            </button>
           

        </form>
         <a href="/dashboard">
                <button class="back-btn">
                    ← Back to Dashboard
                </button>
            </a>

    </div>
    <script src="{{ url_for('static', filename='js/create-group.js') }}"></script>


</body>
</html>
